name: Plugin checks

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: Pushary/.github/.github/workflows/validate-claude-plugin.yml@6a89dde141a3020cb4195ab1a02ebc8c51f9c2bc
    with:
      full_matrix: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
